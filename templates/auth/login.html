{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-8">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-brand-100 text-brand-700 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                <i class="fa-solid fa-seedling"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to manage your plants & care schedule</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
            <div>
                <label for="identifier" class="block text-sm font-medium text-slate-700 mb-1.5">Email or Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="text" id="identifier" name="identifier" value="{{ identifier if identifier else '' }}" required
                        placeholder="you@example.com or username"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm transition-all">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Forgot Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                        placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm transition-all">
                </div>
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember" class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                <label for="remember" class="ml-2 text-sm text-slate-600">Remember my session</label>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center space-x-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-100 pt-6">
            <p class="text-sm text-slate-600">
                Don't have an account yet?
                <a href="{{ url_for('auth.register') }}" class="font-semibold text-brand-600 hover:text-brand-700">Create Account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
